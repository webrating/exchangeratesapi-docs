name: Validate Mintlify Documentation

# The live site is deployed automatically by the Mintlify GitHub App on push to
# master — this workflow does NOT deploy. It validates the docs (config JSON,
# structure, and links) so broken changes are caught around publish.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Validate config JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('docs.json','utf8'))" && echo "docs.json is valid JSON"
          if [ -f openapi.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('openapi.json','utf8'))" && echo "openapi.json is valid JSON"
          fi

      - name: Install Mintlify CLI
        run: npm install -g mint

      - name: Validate documentation structure
        run: mint validate

      - name: Check for broken links
        run: mint broken-links
